<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Feed & Drive Vault</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google API Library -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
 
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
      color: #f8fafc;
      min-height: 100vh;
    }

    /* Glassmorphism effects */
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Animations */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in {
      animation: fadeIn 1s ease-out forwards;
    }

    .message-anim {
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Photo Container styles (Fixed on Middle Left across screen sizes) */
    .photo-corner-container {
      position: fixed;
      top: 50%;
      left: 12px;
      transform: translateY(-50%) rotate(-12deg);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    @media (min-width: 768px) {
      .photo-corner-container {
        left: 24px;
        gap: 8px;
      }
    }

    .photo-caption {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: #e9d5ff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: auto;
      text-align: center;
      max-width: 90px;
      line-height: 1.2;
    }

    @media (min-width: 768px) {
      .photo-caption {
        font-size: 14px;
        max-width: 140px;
      }
    }

    .floating-photo {
      width: 70px;
      height: 70px;
      border-radius: 9999px;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border: 3px solid rgba(168, 85, 247, 0.6);
      pointer-events: auto;
    }

    @media (min-width: 768px) {
      .floating-photo {
        width: 100px;
        height: 100px;
      }
    }

    /* Glowing gradient animations */
    .glow-button {
      transition: all 0.3s ease;
      background-size: 200% 200%;
    }
    .glow-button:hover {
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
    }
    .glow-button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-center">

  <!-- Floating Photo with Caption (Fixed Left) -->
  <div class="photo-corner-container animate-fade-in">
    <img 
      src="images__2_-removebg-preview_upscayl_4x_realesrgan-x4plus-anime.png" 
      alt="Floating Memory" 
      class="floating-photo"
    />
    <p class="photo-caption">place we will never forget</p>
  </div>

  <div class="w-full max-w-2xl h-[90vh] flex flex-col glass-card rounded-3xl overflow-hidden relative border border-slate-700/50">
    
    <!-- App Header -->
    <header class="p-5 border-b border-slate-700/50 flex justify-between items-center bg-slate-900/40">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-paper-plane text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
            O&Z chat feed 
          </h1>
          <h6><p>Made with <span style="color: red;">&hearts;</span> by (Younis) to (Aziza).</p></h6>
          <p class="text-xs text-slate-400 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Google Drive Connected
          </p>
        </div>
      </div>

      <!-- Refresh / Auth Controls -->
      <div class="flex items-center gap-2">
        <button id="refresh_btn" onclick="loadDriveMedia()" class="px-3 py-2 text-xs font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition hidden flex items-center gap-1.5" title="Refresh Feed">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        <button id="auth_btn" onclick="handleAuthClick()" class="px-4 py-2 text-xs font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-2">
          <i class="fa-brands fa-google-drive text-amber-400"></i>
          <span>Connect Drive</span>
        </button>
      </div>
    </header>

    <!-- Message Feed Window -->
    <main id="chat_feed" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 scroll-smooth">
      <!-- Welcome Message -->
      <div id="welcome_msg" class="message-anim flex flex-col items-center justify-center h-full text-center text-slate-400 space-y-3">
        <div class="w-16 h-16 rounded-full bg-slate-800/80 flex items-center justify-center text-2xl text-indigo-400 border border-slate-700">
          <i class="fa-solid fa-comments"></i>
        </div>
        <p class="text-sm max-w-xs">No media uploaded yet. Authenticate Google Drive and share your first voice note, video, or picture!</p>
      </div>
    </main>

    <!-- Upload Indicator Banner -->
    <div id="upload_status" class="hidden px-6 py-2 bg-indigo-600/30 border-t border-indigo-500/30 text-indigo-300 text-xs flex items-center justify-between animate-pulse">
      <span class="flex items-center gap-2">
        <i class="fa-solid fa-circle-notch fa-spin"></i> Syncing media with Google Drive...
      </span>
    </div>

    <!-- Media Input Bar -->
    <footer class="p-4 bg-slate-900/60 border-t border-slate-700/50">
      <form id="upload_form" class="flex items-center gap-3">
        
        <!-- File Picker Input -->
        <label for="media_input" class="cursor-pointer p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700/80 text-indigo-400 hover:text-indigo-300 border border-slate-700/80 transition flex items-center justify-center">
          
          <i class="fa-solid fa-paperclip text-lg"></i>
          
          <input type="file" id="media_input" accept="audio/*,video/*,image/*" class="hidden" onchange="updateFileName()" />
          
        </label>

        <!-- Selected File Label / Status -->
        <div class="flex-1 min-w-0 bg-slate-800/60 rounded-2xl border border-slate-700/60 px-4 py-3 flex items-center gap-3">
          <i id="type_icon" class="fa-solid fa-photo-film text-slate-500"></i>
          <span id="file_name_display" class="text-sm text-slate-400 truncate">Choose Audio, Video, or Image...</span>
        </div>

        <!-- Upload Button -->
        <button type="submit" class="glow-button px-6 py-3.5 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 flex items-center gap-2">
          <span>Send</span>
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
    </footer>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // ========================================================
    // CONFIGURATION - REPLACE WITH YOUR GOOGLE CLOUD CREDENTIALS
    // ========================================================
    const CLIENT_ID = '820964383308-ab45ki68uu48vg15qj2b3p4fe355equ1.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyATMTQ2RVstrplWyNSsfmpAU5l0eHHWxSU';
    const SCOPES = 'https://www.googleapis.com/auth/drive';
    
    // PASTE YOUR SHARED GOOGLE DRIVE FOLDER ID BELOW HERE
    const SHARED_FOLDER_ID = '19JDaxdXtmuiLpfAKFbRaMz5J4tCu8zGc';

    let tokenClient;
    let gapiInited = false;
    let gsiInited = false;
    let accessToken = null;

    // Load GAPI and GIS
    function gapiLoaded() {
      gapi.load('client', async () => {
        await gapi.client.init({
          apiKey: API_KEY,
          discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
        });
        gapiInited = true;
      });
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: '', // defined dynamically
      });
      gsiInited = true;
    }

    window.onload = () => {
      gapiLoaded();
      gisLoaded();
    };

    function handleAuthClick() {
      tokenClient.callback = async (resp) => {
        if (resp.error) {
          throw resp;
        }
        accessToken = resp.access_token;
        document.getElementById('auth_btn').classList.replace('bg-slate-800', 'bg-emerald-600');
        document.getElementById('auth_btn').innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>Connected</span>`;
        document.getElementById('refresh_btn').classList.remove('hidden');
        
        // Auto load existing shared media from Google Drive folder on connect/refresh
        loadDriveMedia();
      };

      if (accessToken === null) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    }

    // UI Input Label Updates
    function updateFileName() {
      const input = document.getElementById('media_input');
      const label = document.getElementById('file_name_display');
      const typeIcon = document.getElementById('type_icon');

      if (input.files.length > 0) {
        const file = input.files[0];
        label.innerText = file.name;
        label.classList.replace('text-slate-400', 'text-slate-100');

        if (file.type.startsWith('audio/')) {
          typeIcon.className = "fa-solid fa-microphone text-indigo-400";
        } else if (file.type.startsWith('video/')) {
          typeIcon.className = "fa-solid fa-video text-purple-400";
        } else if (file.type.startsWith('image/')) {
          typeIcon.className = "fa-solid fa-image text-emerald-400";
        }
      }
    }

    // Handle File Upload Form
    document.getElementById('upload_form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('media_input');

      if (!accessToken) {
        alert('Please connect your Google Drive account first using the button in the top right.');
        return;
      }

      if (input.files.length === 0) {
        alert('Please select a file to send.');
        return;
      }

      const file = input.files[0];
      showUploadStatus(true);

      try {
        await uploadToDrive(file);
        // Reset form
        input.value = '';
        document.getElementById('file_name_display').innerText = 'Choose Audio, Video, or Image...';
        document.getElementById('file_name_display').classList.replace('text-slate-100', 'text-slate-400');
        document.getElementById('type_icon').className = "fa-solid fa-photo-film text-slate-500";
        
        // Reload folder feed to display the new item
        await loadDriveMedia();
      } catch (err) {
        console.error('Upload Failed:', err);
        alert('Failed to upload file to Google Drive. Check permissions and API Key.');
      } finally {
        showUploadStatus(false);
      }
    });

    // Google Drive Multipart Direct Upload Function
    async function uploadToDrive(file) {
      const metadata = {
        name: file.name,
        mimeType: file.type,
      };

      // Direct to specific folder if provided
      if (SHARED_FOLDER_ID && SHARED_FOLDER_ID !== 'YOUR_GOOGLE_DRIVE_FOLDER_ID_HERE') {
        metadata.parents = [SHARED_FOLDER_ID];
      }

      const formData = new FormData();
      formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      formData.append('file', file);

      const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,webViewLink,webContentLink', {
        method: 'POST',
        headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
        body: formData,
      });

      const driveFile = await response.json();

      // Make file publicly accessible so other users with access can stream/view it
      await fetch(`https://www.googleapis.com/drive/v3/files/${driveFile.id}/permissions`, {
        method: 'POST',
        headers: new Headers({
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json'
        }),
        body: JSON.stringify({
          role: 'reader',
          type: 'anyone'
        })
      });

      return driveFile;
    }

    // Load and Display Files Stored in Google Drive
    async function loadDriveMedia() {
      if (!accessToken) return;
      showUploadStatus(true);

      try {
        let query = "trashed = false";
        if (SHARED_FOLDER_ID && SHARED_FOLDER_ID !== 'YOUR_GOOGLE_DRIVE_FOLDER_ID_HERE') {
          query += ` and '${SHARED_FOLDER_ID}' in parents`;
        }

        const res = await gapi.client.drive.files.list({
          q: query,
          fields: 'files(id, name, mimeType, createdTime)',
          orderBy: 'createdTime asc'
        });

        const files = res.result.files;
        const chatFeed = document.getElementById('chat_feed');
        chatFeed.innerHTML = '';

        if (!files || files.length === 0) {
          chatFeed.innerHTML = `
            <div id="welcome_msg" class="message-anim flex flex-col items-center justify-center h-full text-center text-slate-400 space-y-3">
              <div class="w-16 h-16 rounded-full bg-slate-800/80 flex items-center justify-center text-2xl text-indigo-400 border border-slate-700">
                <i class="fa-solid fa-comments"></i>
              </div>
              <p class="text-sm max-w-xs">No media found in the folder. Upload your first file!</p>
            </div>`;
          return;
        }

        files.forEach(file => {
          appendMessageToFeed(file, file.mimeType);
        });

      } catch (err) {
        console.error("Error fetching Drive files:", err);
      } finally {
        showUploadStatus(false);
      }
    }

    function showUploadStatus(show) {
      const banner = document.getElementById('upload_status');
      banner.style.display = show ? 'flex' : 'none';
    }

    // Render Media into Feed
    function appendMessageToFeed(file, mimeType) {
      const chatFeed = document.getElementById('chat_feed');

      const msgWrapper = document.createElement('div');
      msgWrapper.className = 'message-anim flex flex-col items-end space-y-1 mb-4';

      const timestamp = file.createdTime 
        ? new Date(file.createdTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let mediaHtml = '';

      if (mimeType && mimeType.startsWith('image/')) {
        const imageUrl = `https://lh3.googleusercontent.com/d/${file.id}`;
        mediaHtml = `
          <div class="bg-slate-800/80 p-2 rounded-3xl rounded-tr-sm shadow-lg max-w-sm w-full border border-slate-700/70">
            <img src="${imageUrl}" alt="${file.name}" class="w-full h-auto max-h-80 object-cover rounded-2xl border border-slate-700/50" loading="lazy">
            <p class="text-xs text-slate-300 font-medium px-2 pt-2 truncate">${file.name}</p>
          </div>
        `;
      } else if (mimeType && mimeType.startsWith('audio/')) {
        const previewUrl = `https://drive.google.com/file/d/${file.id}/preview`;
        mediaHtml = `
          <div class="bg-gradient-to-r from-indigo-600 to-indigo-700 p-3 rounded-3xl rounded-tr-sm shadow-lg max-w-sm w-full border border-indigo-500/30">
            <div class="flex items-center gap-3 mb-2 px-1">
              <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white text-sm">
                <i class="fa-solid fa-microphone"></i>
              </div>
              <div class="flex-1">
                <p class="text-xs font-semibold text-indigo-100">Voice Message</p>
                <p class="text-[10px] text-indigo-200/80 truncate max-w-[180px]">${file.name}</p>
              </div>
            </div>
            <iframe src="${previewUrl}" class="w-full h-16 rounded-xl border-0 overflow-hidden" allow="autoplay"></iframe>
          </div>
        `;
      } else if (mimeType && mimeType.startsWith('video/')) {
        const previewUrl = `https://drive.google.com/file/d/${file.id}/preview`;
        mediaHtml = `
          <div class="bg-gradient-to-r from-slate-800 to-slate-900 p-2.5 rounded-3xl rounded-tr-sm shadow-lg max-w-md w-full border border-slate-700">
            <div class="relative rounded-2xl overflow-hidden bg-black/40 h-56">
              <iframe src="${previewUrl}" class="w-full h-full rounded-2xl border-0" allow="autoplay"></iframe>
            </div>
            <p class="text-xs text-slate-300 font-medium px-2 pt-2 truncate">${file.name}</p>
          </div>
        `;
      }

      if (mediaHtml !== '') {
        msgWrapper.innerHTML = `
          ${mediaHtml}
          <span class="text-[10px] text-slate-500 px-1 font-medium">${timestamp}</span>
        `;
        chatFeed.appendChild(msgWrapper);
        chatFeed.scrollTop = chatFeed.scrollHeight;
      }
    }
  </script>
</body>
</html>
